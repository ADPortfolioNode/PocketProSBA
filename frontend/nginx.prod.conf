server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Standalone pages (same aliases as nginx.dev.conf). Without these, /browse
    # fell through to index.html and the SPA bounced it back to /browse.
    location = /browse { try_files /resources.html =404; }
    location = /resources { try_files /resources.html =404; }
    location = /sba { try_files /programs.html =404; }
    location = /sba/ { try_files /programs.html =404; }
    location = /programs { try_files /programs.html =404; }

    # Handle client-side routing for React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:5000; # 'backend' is the service name in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}