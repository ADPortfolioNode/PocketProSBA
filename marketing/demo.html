<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo — PocketProSBA</title>
  <meta name="description" content="Magazine-style SBA concierge demo with cited answers." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-nav></div>

  <main id="main">
    <section class="content-stage">
      <img class="content-stage__photo" src="css/assets/chat-bg/general.jpg" alt="" aria-hidden="true" />
      <div class="content-stage__overlay" aria-hidden="true"></div>
      <article class="chat-card">
        <div id="chat-root" class="chat-empty">
          <h2>Start a conversation</h2>
          <p>Ask a funding question. Answers render as editorial prose with the same sources listed below.</p>
          <div class="chips" id="chips"></div>
        </div>
        <form class="composer" id="ask-form">
          <label for="q" style="position:absolute;left:-9999px">Question</label>
          <input id="q" name="q" type="text" autocomplete="off" placeholder="Ask about 7(a), 504, eligibility…" required />
          <button class="btn btn-primary" type="submit">Ask</button>
        </form>
      </article>
    </section>
  </main>

  <div data-footer></div>
  <script src="js/nav.js"></script>
  <script src="js/query-render.js"></script>
<script>
(function(){var samples=["Which SBA loan fits a retail startup?","How do I prepare for a 7(a) application?","Compare 7(a) and 504 at a glance.","What are the basic SBA eligibility rules?"];var chips=document.getElementById("chips");var root=document.getElementById("chat-root");var form=document.getElementById("ask-form");var input=document.getElementById("q");samples.forEach(function(text){var btn=document.createElement("button");btn.type="button";btn.className="chip";btn.textContent=text;btn.addEventListener("click",function(){run(text)});chips.appendChild(btn)});function run(q){var payload=window.PocketProQuery.lookupSample(q);root.classList.remove("chat-empty");window.PocketProQuery.renderQueryResult(root,payload,q);input.value=q}form.addEventListener("submit",function(e){e.preventDefault();run(input.value.trim())})})();
</script>
</body>
</html>
